<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title description"><title>AUTORENT SISTEMOS PANAUDOS ATVEJŲ DIAGRAMA</title>
  <title id="title">AutoRent sistemos panaudos atvejai</title>
  <desc id="description">Aktorių generalizacija vaizduoja sistemoje prieinamų funkcijų įtraukimą, ne pareigybių pavaldumą. Mechanikui prieinamos bendros nuomos administravimo funkcijos; klientų aptarnavimui papildomai pokalbiai; vadybininkui perskyrimas; administratoriui darbuotojų administravimas ir šalinimas. Include susieja rezervavimą su užimtumo patikra. Extend susieja nuolaidą su užsakymo kūrimu.</desc>
